<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini CDN Demonstration</title>
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 2.5rem;
            max-width: 600px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        h1 {
            color: #6366f1;
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        p {
            font-size: 1.1rem;
            color: #cbd5e1;
            line-height: 1.6;
        }
        .logo-img {
            max-width: 150px;
            height: auto;
            border-radius: 8px;
            margin: 1.5rem 0;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }
        .badge {
            background-color: #10b981;
            color: white;
            padding: 0.3rem 0.8rem;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: bold;
            display: inline-block;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Mini CDN</h1>
        <p>A distributed CDN implementation featuring intelligent cache control, consistent hashing load balancing, and automated failover capabilities.</p>
        <img class="logo-img" src="/assets/logo.png" alt="Mini CDN Logo">
        <p>Loaded from the origin content store via edge nodes.</p>
        <div class="badge" id="demo-badge">Initialized</div>
    </div>
    <script src="/assets/app.js"></script>
</body>
</html>
